<!DOCTYPE html><title>-> data URI</title>

<style>
    :root {
        --bg:#24273a; 
        --panel: #363a4f;
        --text: #cad3f5;
        --muted: #6e738d;
        --accent: #b7bdf8;
        --accent-dim: #c6a0f6;
        --border: #1e2030;
    }




    body {
        background: var(--bg);
        color: var(--text);
        font: 14px monospace;
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
    }


    textarea, input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 10px;
        padding: 10px;
        background: var(--panel);
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 4px;
        font: 13px monospace;
        outline: none;
    }

    textarea {height: 100px; resize: vertical;}
    textarea:focus, input:focus {border-color: var(--accent-dim); };



    input {color: var(--accent); background: var(--bg); }
    input::placeholder { color: var(--muted); }
    textarea::placeholder { color: var(--muted); }

    button {
        display: block;
        margin-bottom: 10px;
        padding: 10px 20px;
        font: 16px monospace;
        background: var(--accent-dim);
        color: var(--bg);   
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover { background: var(--accent); }


    label { color: var(--muted); font-size: 12px; }
</style>

<textarea id=i placeholder="paste your one-line HTML here"></textarea>

<button onclick="go()">convert</button>

<label>precent-encoded</label>
<input id="a" readonly placeholder="precent-encoding result">

<label>base64</label>
<input id="b" readonly placeholder="base64 result">

<script>
const go=()=>{
    const s=i.value;
    a.value='data:text/html;charset=utf-8,'+encodeURIComponent(s);
    b.value='data:text/html;base64,'+btoa(unescape(encodeURIComponent(s)));
};
</script>
