<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rat's Tail</title>


<style>
  html,body{margin:0;height:100%;background:#0a0a0f;overflow:hidden;cursor:none}
  canvas{display:block}
</style>


</head>
<body>
<canvas id="c"></canvas>
<script>
(()=> {
const c=document.getElementById('c'),x=c.getContext('2d');
let W,H,px=0,py=0,mx=0,my=0;

let h=190;

function size(){c.width=W=innerWidth;c.height=H=innerHeight;}
addEventListener('resize',size);size();
mx=px=innerWidth/2;my=py=innerHeight/2;

//

let AC=null, voice=null, bpF=null;

function ensureAudio(){
    if(AC)return;
    AC=new (window.AudioContext||window.webkitAudioContext)();


    // noise remake pink/paul kelleth 6th
    const len=AC.sampleRate*2, buf=AC.createBuffer(1, len, AC.sampleRate), ch=buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;

    for(let i=0; i<len; i++){
        const w=Math.random()*2-1;

        b0=0.99886*b0+w*0.0555179;

        b1=0.99332*b1+w*0.0750759;

        b2=0.96900*b2+w*0.1538520;

        b3=0.86650*b3+w*0.3104856;

        b4=0.55000*b4+w*0.5329522;

        b5=-0.7616*b5-w*0.016898;

        ch[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;

        b6=w*0.115926;
    }

    // noise remake






    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;

    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=700; bp.Q.value=0.9;

    voice=AC.createGain(); voice.gain.value=0.0001;
    
    bpF=bp;

    src.connect(bp).connect(voice).connect(AC.destination);

    src.start();
}


function ClickBing(){
    ensureAudio(); AC.resume();

    const now=AC.currentTime;
    const o=AC.createOscillator();

    o.type='sine';
    o.frequency.setValueAtTime(2200, now);

    o.frequency.exponentialRampToValueAtTime(80, now+0.35);

    const g=AC.createGain();

    g.connect(AC.destination);

    g.gain.setValueAtTime(0.0001, now);

    g.gain.exponentialRampToValueAtTime(0.25, now+0.005);

    g.gain.exponentialRampToValueAtTime(0.001, now+0.35);

    o.connect(g).connect(AC.destination);


    o.start(now);
    o.stop(now+0.36)
}












//
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY; ensureAudio()
    if(AC.state==='suspended')AC.resume();
});

const hue=o=>`hsl(${h+o} 100% 60%)`;
const P=[];
const push=(X,Y,vx,vy,r,a,d,o=0)=>P.push({x:X,y:Y,vx,vy,r,a,d,c:hue(o)});

function emit(){
    const dx=mx-px,dy=my-py,d=Math.hypot(dx,dy),s=Math.max(1,Math.ceil(d/6));
    for(let i=1;i<=s;i++)push(px+dx*i/s,py+dy*i/s,(Math.random()-.5)*.6,
(Math.random()-.5)*.6,1+Math.random()*2,1,.02);
    px=mx;py=my;
}

function burst(n,sp,o){
    for(let i=0;i<n;i++){
        const a=Math.random()*7,v=sp*(.3+Math.random());
        push(mx+Math.cos(a)*6,my+Math.sin(a)*6,Math.cos(a)*v,Math.sin(a)*v,1+Math.random()*3.5,1,.04,
(Math.random()-.5)*o);
    }
}


let lastMx=mx, lastMy=my, smoothSpeed=0;


function loop(){

    const dx=mx-lastMx, dy=my-lastMy;
    const rawSpeed=Math.hypot(dx,dy);

    lastMx=mx; lastMy=my;

    smoothSpeed += (rawSpeed-smoothSpeed)*0.25;


    x.fillStyle='rgba(0,0,0,0.1)';
    x.fillRect(0,0,W,H);
    emit();
    for(let i=P.length-1;i>=0;i--){
        const p=P[i];

        p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;p.a-=p.d;

        if(p.a<=0){P.splice(i,1);continue}

        x.globalAlpha=p.a;x.fillStyle=p.c;

        x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()
    }
    x.globalAlpha=1;


    // changer part
    if(voice){
        const now=AC.currentTime;
        const s=Math.min(1, smoothSpeed/60);

        const amp=0.0001 + Math.pow(s, 1.4)*0.22;
        
        voice.gain.setTargetAtTime(amp, now, 0.06);
    }








    requestAnimationFrame(loop);
}

addEventListener('mousedown',e=>{
    if(e.button===0)burst(90,9,70);
    else if(e.button===2){h=(h+50)%360;burst(40,6,90)}
    e.preventDefault();
});
addEventListener('contextmenu',e=>e.preventDefault());

addEventListener('click', ClickBing);

requestAnimationFrame(loop);
})();
</script>
</body>
</html>
