<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rat's Tail</title>
<style>
  html,body{margin:0;height:100%;background:#0a0a0f;overflow:hidden;cursor:none}
  canvas{display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>



(()=> {
const x=c.getContext('2d'),P=[];

let W,H,px=0,py=0,mx=0,my=0,h=190,sp=0,A,V,NB;

const size=()=>{c.width=W=innerWidth;c.height=H=innerHeight};
onresize=size;size();px=mx=innerWidth/2;py=my=innerHeight/2;

const hue=o=>`hsl(${h+o} 100% 60%)`;

const push=(X,Y,vx,vy,r,a,d,o=0)=>P.push({x:X,y:Y,vx,vy,r,a,d,c:hue(o)});

const burst=(n,s,o)=>{for(let i=0;i<n;i++){const a=Math.random()*7,v=s*(.3+Math.random());
    push(mx+Math.cos(a)*6,my+Math.sin(a)*6,Math.cos(a)*v,Math.sin(a)*v,1+Math.random()*3.5,1,.04,(Math.random()*.5)*o)}
};

const au=()=>{
    if(A)return;
    A=new AudioContext;A.resume();
    const L=A.sampleRate*2,B=A.createBuffer(1,L,A.sampleRate),d=B.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<L;i++){const w=Math.random()*2-1;
        b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926};
    NB=B;
    const s=A.createBufferSource();s.buffer=B;s.loop=true;
    const F=A.createBiquadFilter();F.type='bandpass';F.frequency.value=700;F.Q.value=.9;
    V=A.createGain();V.gain.value=.0001;
    s.connect(F).connect(V).connect(A.destination);s.start();
};

const gust=v=>{au();A.resume();const n=A.currentTime,s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain();
    s.buffer=NB;f.type='bandpass';f.frequency.value=2500;
    f.frequency.exponentialRampToValueAtTime(150,n+.5)
    g.gain.value=.0001;
    g.gain.exponentialRampToValueAtTime(v,n+.03);
    g.gain.exponentialRampToValueAtTime(.0001,n+.58);
    s.connect(f).connect(g).connect(A.destination);
    s.start(n,1.3*Math.random());s.stop(n+.6)
};

onmousemove=e=>{mx=e.clientX;my=e.clientY;au()};

onmousedown=e=>{au();A.resume();
    if(e.button)e.button==2&&(h=(h+50)%360,burst(40,6,90),gust(.5));
    else burst(90,9,70),gust(1);
    e.preventDefault()};
oncontextmenu=e=>e.preventDefault();

const loop=()=>{
    const dx=mx-px,dy=my-py,d=Math.hypot(dx,dy);
    sp+=(d-sp)*.25;
    x.fillStyle='rgba(0,0,0,.1)';x.fillRect(0,0,W,H);
    const s=Math.max(1,Math.ceil(d/6));
    for(let i=1;i<=s;i++)push(px+dx*i/s,py+dy*i/s,(Math.random()-.5)*.6,(Math.random()-.5)*.6,1+Math.random()*2,1,.02);
    px=mx;py=my;
    for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.vy*=.97;
        if((p.a-=p.d)>0){x.globalAlpha=p.a;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}else P.splice(i,1)}
    x.globalAlpha=1;
    if(V)V.gain.setTargetAtTime(.0001+Math.min(1,sp/60)**1.4*.22,A.currentTime,.06);
    requestAnimationFrame(loop);
};
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
